apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 2
  selector:
    matchLabels: { app: backend }
  template:
    metadata:
      labels: { app: backend }
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      containers:
        - name: api
          image: backend
          args: ["serve"]
          ports:
            - { name: http, containerPort: 8080 }
          envFrom:
            - configMapRef: { name: backend-config }
            - secretRef: { name: app-db } # DB_HOST, DB_PORT, DB_USER, DB_PASSWORD, DB_NAME
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests: { cpu: 100m, memory: 64Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: backend # frontend の API_ORIGIN=http://backend:8080 で解決される
spec:
  selector: { app: backend }
  ports:
    - { name: http, port: 8080, targetPort: http }
