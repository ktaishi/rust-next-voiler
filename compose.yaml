name: voiler

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-app}
      MYSQL_USER: ${MYSQL_USER:-app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-app}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 3s
      retries: 30

  backend:
    image: voiler-backend:local
    build: ./backend
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-app}:${MYSQL_PASSWORD:-app}@mysql:3306/${MYSQL_DATABASE:-app}
      RUN_MIGRATIONS: "true"
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      RUST_LOG: info,api=debug
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy

  # バッチ: docker compose run --rm batch <job> [args]  (例: archive-completed --older-than-days 30)
  batch:
    image: voiler-backend:local
    build: ./backend
    profiles: ["batch"]
    entrypoint: ["/app/batch"]
    command: ["status"]
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-app}:${MYSQL_PASSWORD:-app}@mysql:3306/${MYSQL_DATABASE:-app}
      DB_MAX_CONNECTIONS: "10"
      RUST_LOG: info,batch=debug
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    image: voiler-frontend:local
    build: ./frontend
    environment:
      API_ORIGIN: http://backend:8080 # 実行時に解決 (イメージは環境非依存)
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend

volumes:
  mysql-data:
