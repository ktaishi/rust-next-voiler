name: 機能要望
description: 新機能・仕様変更 (/requirements の入力になる)
labels: [feature]
body:
  - type: textarea
    id: background
    attributes: { label: 背景・目的, description: 誰のどんな課題を解決するか }
    validations: { required: true }
  - type: textarea
    id: want
    attributes: { label: やりたいこと }
    validations: { required: true }
  - type: textarea
    id: acceptance
    attributes: { label: 受入条件 (分かる範囲で), placeholder: "Given ... When ... Then ..." }
  - type: textarea
    id: out-of-scope
    attributes: { label: 対象外 }
