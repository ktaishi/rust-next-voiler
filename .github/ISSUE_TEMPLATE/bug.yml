name: バグ報告
description: 不具合の報告
labels: [bug]
body:
  - type: textarea
    id: repro
    attributes: { label: 再現手順 }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: 期待する動作 }
    validations: { required: true }
  - type: textarea
    id: actual
    attributes: { label: 実際の動作 / ログ }
    validations: { required: true }
