name: Load test

on:
  workflow_dispatch:
    inputs:
      profile:
        description: k6 profile
        type: choice
        options: [smoke, load, stress, spike]
        default: load
      base_url:
        description: 対象 URL (空ならワークフロー内で compose 起動したスタック)
        required: false
        default: ""
  schedule:
    - cron: "17 18 * * 0" # 毎週月曜 03:17 JST

permissions:
  contents: read

jobs:
  k6:
    runs-on: ubuntu-latest
    env:
      PROFILE: ${{ inputs.profile || 'load' }}
      BASE_URL: ${{ inputs.base_url || 'http://localhost:8080' }}
    steps:
      - uses: actions/checkout@v5
      - name: start stack
        if: ${{ !inputs.base_url }}
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: run k6
        run: make loadtest PROFILE="$PROFILE" BASE_URL="$BASE_URL"
      - name: summary
        if: always()
        run: |
          f=loadtest/results/summary.json
          [ -f "$f" ] || exit 0
          jq -r '"### k6 (\(env.PROFILE))\n| metric | value |\n|---|---|\n| requests | \(.metrics.http_reqs.values.count) |\n| p95 | \(.metrics.http_req_duration.values["p(95)"]) ms |\n| p99 | \(.metrics.http_req_duration.values["p(99)"]) ms |\n| error rate | \(.metrics.http_req_failed.values.rate) |"' "$f" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: k6-${{ env.PROFILE }}
          path: loadtest/results
